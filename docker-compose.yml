name: makanan

services:
  db:
    image: postgres:16-alpine
    container_name: makanan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makanan}
      POSTGRES_USER: ${POSTGRES_USER:-makanan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-78426dff744565d5f6b91cdb0cdfb6d67de1433d942f3cf9}
    volumes:
      - makanan_pgdata:/var/lib/postgresql/data
      - ./scripts/init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makanan_admin -d makanan"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: makanan_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-e0503fe6910ad0bdb0061a888b50256b4d6fef6b988a8d45} --appendonly yes
    volumes:
      - makanan_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-e0503fe6910ad0bdb0061a888b50256b4d6fef6b988a8d45}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makanan_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  makanan_pgdata:
  makanan_redisdata:
